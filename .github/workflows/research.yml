name: Shanghai research and Pages

on:
  push:
    # The job below admits only the repository's current default branch.
    branches: ['**']
    paths:
      - '.github/workflows/research.yml'
      - '*.py'
      - 'pages.js'
      - 'engine/**'
      - 'seed/**'
      - 'tests/**'
  schedule:
    # UTC. The original 08:00 collection / 09:00 publication remain the targets.
    # A few off-hour retries share the same pre-market window; actual Beijing
    # time and the official SSE calendar remain authoritative inside the runner.
    - cron: '0 0 * * 1-5'
    - cron: '17 0 * * 1-5'
    - cron: '43 0 * * 1-5'
    - cron: '0 1 * * 1-5'
    - cron: '7 1 * * 1-5'
    - cron: '17 1 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Run collection or publish the current session report'
        required: true
        type: choice
        options: [collect, publish, fundamentals]

permissions:
  contents: read

concurrency:
  group: huyan-research-state
  cancel-in-progress: false

jobs:
  research:
    # Public hosting is authorized only for this repository. Explicit false pauses
    # automatic research; manual default-branch runs remain available.
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (vars.ENABLE_SCHEDULED_RESEARCH != 'false' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    outputs:
      site_ready: ${{ steps.research.outputs.site_ready }}
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the authorized research stage explicitly
        id: stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_STAGE: ${{ github.event.inputs.stage }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            schedule)
              case "$SCHEDULE" in
                '0 0 * * 1-5'|'17 0 * * 1-5'|'43 0 * * 1-5') stage=collect ;;
                '0 1 * * 1-5'|'7 1 * * 1-5'|'17 1 * * 1-5') stage=publish ;;
                *) echo '::error::Unrecognized research schedule'; exit 1 ;;
              esac ;;
            workflow_dispatch)
              case "$REQUESTED_STAGE" in
                collect|publish|fundamentals) stage="$REQUESTED_STAGE" ;;
                *) echo '::error::Unrecognized manual research stage'; exit 1 ;;
              esac ;;
            push) stage=publish ;;
            *) echo '::error::Unrecognized research event'; exit 1 ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Locate the latest successful persistent research artifact
        id: cache
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const selected = artifacts.filter(a => ['huyan-research-cache','huyan-research-cache-financial'].includes(a.name) && !a.expired && a.workflow_run?.head_branch === context.payload.repository.default_branch)
              .sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
            if (selected) {
              core.setOutput('run_id', String(selected.workflow_run.id));
              core.setOutput('name', selected.name);
            }
            const plans = artifacts.filter(a => ['huyan-daily-plans','huyan-daily-plans-financial'].includes(a.name) && !a.expired && a.workflow_run?.head_branch === context.payload.repository.default_branch)
              .sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
            if (plans) {
              core.setOutput('plans_run_id', String(plans.workflow_run.id));
              core.setOutput('plans_name', plans.name);
            }
            const fs = require('node:fs'), crypto = require('node:crypto');
            const path = 'research/daily-plans.json';
            const bytes = fs.existsSync(path) ? fs.readFileSync(path) : null;
            core.setOutput('plans_base_sha', bytes ? crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex') : 'missing');
      - name: Restore the previous stage's public research state
        if: steps.cache.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cache.outputs.name }}
          path: .cache/restored
          github-token: ${{ github.token }}
          run-id: ${{ steps.cache.outputs.run_id }}
      - name: Restore the durable daily-advice archive independently of the 1-day cache
        if: steps.cache.outputs.plans_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cache.outputs.plans_name }}
          path: .cache/plans-restored
          github-token: ${{ github.token }}
          run-id: ${{ steps.cache.outputs.plans_run_id }}
      - name: Collect or publish using actual Beijing time
        id: research
        env:
          RESEARCH_STAGE: ${{ steps.stage.outputs.stage }}
        run: >-
          python runner.py "$RESEARCH_STAGE"
          --engine-dir engine --state-dir .state
          --restore-cache .cache/restored --cache-output .cache/export
          --restore-plans .cache/plans-restored --plans-output .cache/plans-export
          --seed seed/research.json.gz --output-dir public
      - name: Commit changed public advice archive with optimistic concurrency protection
        if: steps.research.outputs.site_ready == 'true' && steps.stage.outputs.stage == 'publish'
        uses: actions/github-script@v7
        env:
          PLANS_BASE_SHA: ${{ steps.cache.outputs.plans_base_sha }}
        with:
          script: |
            const fs = require('node:fs'), crypto = require('node:crypto');
            const path = 'research/daily-plans.json', bytes = fs.readFileSync(path);
            const localSha = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
            const owner = context.repo.owner, repo = context.repo.repo, branch = context.payload.repository.default_branch;
            let remote = null;
            try { remote = (await github.rest.repos.getContent({owner,repo,path,ref:branch})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (remote?.sha === localSha) { core.info('Public advice unchanged; no commit.'); return; }
            if ((remote?.sha || 'missing') !== process.env.PLANS_BASE_SHA) {
              throw new Error('Advice archive changed remotely. Refusing replacement; rerun with the latest checkout.');
            }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,
              message:'Update immutable public daily research archive', content:bytes.toString('base64'),
              ...(remote ? {sha:remote.sha} : {})});
      - name: Persist only sanitized public research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huyan-research-cache
          path: |
            .cache/export/research.sqlite3
            .cache/export/cache-meta.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
      - name: Back up the complete public daily-advice archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huyan-daily-plans
          path: .cache/plans-export/daily-plans.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Package the static research site
        if: steps.research.outputs.site_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.research.outputs.site_ready == 'true' && vars.ENABLE_PAGES_DEPLOY != 'false'
    needs: research
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static research to Pages
        id: deployment
        uses: actions/deploy-pages@v4
  fundamentals:
    # Long financial refresh must not hold the shared queue ahead of 09:07/09:17
    # publication recovery. Only the last retry continues the financial chain;
    # a manual fundamentals run executes that stage directly in research above.
    if: needs.deploy.result == 'success' && needs.health.result == 'success' && github.event_name == 'schedule' && github.event.schedule == '17 1 * * 1-5'
    needs: [research, deploy, health]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      site_ready: ${{ steps.finance.outputs.site_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore this run's published research and immutable daily plan
        uses: actions/download-artifact@v4
        with:
          name: huyan-research-cache
          path: .cache/restored
      - name: Restore this run's complete daily-advice archive
        uses: actions/download-artifact@v4
        with:
          name: huyan-daily-plans
          path: .cache/plans-restored
      - name: Update long-term fundamentals without publishing a new daily plan
        id: finance
        run: >-
          python runner.py fundamentals
          --engine-dir engine --state-dir .state
          --restore-cache .cache/restored --cache-output .cache/financial-export
          --restore-plans .cache/plans-restored --plans-output .cache/financial-plans-export
          --seed seed/research.json.gz --output-dir public
      - name: Persist updated public financial research
        if: always() && steps.finance.outputs.site_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: huyan-research-cache-financial
          path: |
            .cache/financial-export/research.sqlite3
            .cache/financial-export/cache-meta.json
          include-hidden-files: true
          retention-days: 1
          compression-level: 6
      - name: Preserve the complete public daily-advice archive after financial research
        if: always() && steps.finance.outputs.site_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: huyan-daily-plans-financial
          path: .cache/financial-plans-export/daily-plans.json
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
      - name: Package the site with updated long-term research
        if: steps.finance.outputs.site_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-longterm
          path: public
  deploy-longterm:
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.fundamentals.outputs.site_ready == 'true' && vars.ENABLE_PAGES_DEPLOY != 'false'
    needs: fundamentals
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated long-term section
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-longterm
  cloud-status:
    # Surface actual failure in the run summary; the cloud monitor reads this
    # run's results. Failed refreshes leave the last successful Pages deployment.
    if: always()
    needs: [research, deploy, health, fundamentals, deploy-longterm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record actual cloud outcomes without claiming on-time publication
        uses: actions/github-script@v7
        env:
          RESEARCH_RESULT: ${{ needs.research.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          FUNDAMENTALS_RESULT: ${{ needs.fundamentals.result }}
          LONGTERM_RESULT: ${{ needs.deploy-longterm.result }}
          HEALTH_RESULT: ${{ needs.health.result }}
          RESEARCH_STAGE: ${{ needs.research.outputs.stage }}
        with:
          script: |
            const completedAt = new Date().toISOString();
            const results = [
              ['Research', process.env.RESEARCH_RESULT],
              ['Pages', process.env.DEPLOY_RESULT],
              ['Fundamentals', process.env.FUNDAMENTALS_RESULT],
              ['Long-term Pages', process.env.LONGTERM_RESULT],
              ['Public site verification', process.env.HEALTH_RESULT]
            ];
            await core.summary.addHeading('Actual cloud execution')
              .addRaw(`Event: ${context.eventName}; stage: ${process.env.RESEARCH_STAGE || 'unresolved'}; observed: ${completedAt}\n\n`)
              .addTable([['Job', 'Result'], ...results])
              .addLink('Open this run', `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`)
              .addRaw('\n\nGitHub schedules can queue or be delayed. Read the daily plan published_at and source timestamps; a successful job does not prove 09:00 publication.\n')
              .write();
            if (results.some(([, result]) => ['failure', 'cancelled'].includes(result))) {
              core.setFailed('A cloud stage failed or was cancelled. Review the job logs; the previous successful static site remains available.');
            }
  health:
    if: always() && needs.deploy.result == 'success'
    needs: [research, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the public phone site and the final morning report
        env:
          REQUIRE_MORNING: ${{ github.event_name == 'schedule' && github.event.schedule == '17 1 * * 1-5' && 'true' || 'false' }}
        shell: bash
        run: |
          if [ "$REQUIRE_MORNING" = 'true' ]; then
            python cloud_health.py --require-morning
          else
            python cloud_health.py
          fi
