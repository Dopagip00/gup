name: Shanghai research and Pages

on:
  push:
    # The job below admits only the repository's current default branch.
    branches: ['**']
    paths:
      - '.github/workflows/research.yml'
      - '*.py'
      - 'pages.js'
      - 'engine/**'
      - 'seed/**'
      - 'tests/**'
      - 'research/ai-reviews/**'
  schedule:
    # UTC: 07:50 light preparation; 08:00 collection plus off-hour retries.
    # 09:00 is a client reveal of honestly prepublished observation research;
    # actual server publication uses its real clock, never a promised cron time.
    - cron: '50 23 * * 0-4'
    - cron: '0 0 * * 1-5'
    - cron: '20 0 * * 1-5'
    - cron: '50 0 * * 1-5'
    - cron: '3 1 * * 1-5'
    - cron: '11 1 * * 1-5'
    - cron: '19 1 * * 1-5'
    # Separate closing-bar updates, not morning collection or new daily advice.
    - cron: '20 8 * * 1-5'
    - cron: '10 9 * * 1-5'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Run collection or publish the current session report'
        required: true
        type: choice
        options: [collect, publish, fundamentals, recover]

permissions:
  contents: read

concurrency:
  group: huyan-research-state
  cancel-in-progress: false

jobs:
  official-universe:
    # An independent Windows egress fetches the same official SSE source.
    # A failed collector never authorizes a stale or partial membership list.
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (vars.ENABLE_SCHEDULED_RESEARCH != 'false' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    timeout-minutes: 8
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      receipt_ready: ${{ steps.collect.outputs.receipt_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect a fresh complete official membership receipt
        id: collect
        run: python universe_receipt.py collect --output-dir .cache/universe
      - name: Pass this run's verified public source to the research runner
        if: steps.collect.outputs.receipt_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: huyan-current-official-universe
          path: .cache/universe/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  research:
    # Public hosting is authorized only for this repository. Explicit false pauses
    # automatic research; manual default-branch runs remain available.
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (vars.ENABLE_SCHEDULED_RESEARCH != 'false' || github.event_name == 'workflow_dispatch')
    needs: official-universe
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      actions: read
    outputs:
      site_ready: ${{ steps.research.outputs.site_ready }}
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve the authorized research stage explicitly
        id: stage
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_STAGE: ${{ github.event.inputs.stage }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            schedule)
              case "$SCHEDULE" in
                '0 0 * * 1-5'|'20 0 * * 1-5'|'50 0 * * 1-5'|'20 8 * * 1-5'|'10 9 * * 1-5') stage=collect ;;
                '50 23 * * 0-4'|'3 1 * * 1-5'|'11 1 * * 1-5'|'19 1 * * 1-5') stage=publish ;;
                *) echo '::error::Unrecognized research schedule'; exit 1 ;;
              esac ;;
            workflow_dispatch)
              case "$REQUESTED_STAGE" in
                collect|publish|fundamentals|recover) stage="$REQUESTED_STAGE" ;;
                *) echo '::error::Unrecognized manual research stage'; exit 1 ;;
              esac ;;
            push) stage=publish ;;
            *) echo '::error::Unrecognized research event'; exit 1 ;;
          esac
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
      - name: Read latest default-branch business archives before restoring state
        id: archives
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const owner=context.repo.owner,repo=context.repo.repo,ref=context.payload.repository.default_branch;
            const maxBytes=64*1024*1024;
            async function restoreArchive(path,output) {
              let current;
              try { current=(await github.rest.repos.getContent({owner,repo,path,ref})).data; }
              catch(error) {
                if(error.status!==404)throw error;
                fs.rmSync(path,{force:true});
                core.setOutput(output,'missing');
                return;
              }
              if(!current||current.type!=='file'||current.path!==path||current.target||current.submodule_git_url
                  ||!/^[0-9a-f]{40}$/.test(current.sha)||!Number.isSafeInteger(current.size)
                  ||current.size<1||current.size>maxBytes)throw new Error('Invalid current business archive metadata');
              let blob=current;
              if(current.encoding!=='base64') {
                if(current.encoding!=='none'||current.content!=='')throw new Error('Invalid current archive encoding');
                blob=(await github.rest.git.getBlob({owner,repo,file_sha:current.sha})).data;
              }
              if(!blob||blob.encoding!=='base64'||typeof blob.content!=='string'||blob.content.length>maxBytes*2
                  ||blob.sha!==current.sha||blob.size!==current.size)throw new Error('Invalid current archive blob');
              const encoded=blob.content.replace(/[\t\r\n ]/g,'');
              if(encoded.length!==4*Math.ceil(current.size/3)||!/^[A-Za-z0-9+/]*={0,2}$/.test(encoded))
                throw new Error('Invalid current archive base64');
              const bytes=Buffer.from(encoded,'base64');
              const sha=crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
              if(bytes.length!==current.size||bytes.toString('base64')!==encoded||sha!==current.sha)
                throw new Error('Current business archive SHA mismatch');
              fs.mkdirSync('research',{recursive:true});
              fs.writeFileSync(path,bytes);
              core.setOutput(output,current.sha);
            }
            // A queued workflow checks out its pinned source commit. Business
            // archives must instead start at the current branch's real lease.
            // runner.py still validates their complete contracts before merging.
            await restoreArchive('research/daily-plans.json','plans_base_sha');
            await restoreArchive('research/daily-watchlists.json','watchlists_base_sha');
      - name: Locate the latest successful persistent research artifact
        id: cache
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100
            });
            const selected = artifacts.filter(a => ['huyan-research-cache','huyan-research-cache-financial'].includes(a.name) && !a.expired && a.workflow_run?.head_branch === context.payload.repository.default_branch)
              .sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
            if (selected) {
              core.setOutput('run_id', String(selected.workflow_run.id));
              core.setOutput('name', selected.name);
            }
            const plans = artifacts.filter(a => ['huyan-daily-plans','huyan-daily-plans-financial'].includes(a.name) && !a.expired && a.workflow_run?.head_branch === context.payload.repository.default_branch)
              .sort((a,b) => b.created_at.localeCompare(a.created_at))[0];
            if (plans) {
              core.setOutput('plans_run_id', String(plans.workflow_run.id));
              core.setOutput('plans_name', plans.name);
            }
      - name: Restore the previous stage's public research state
        if: steps.cache.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cache.outputs.name }}
          path: .cache/restored
          github-token: ${{ github.token }}
          run-id: ${{ steps.cache.outputs.run_id }}
      - name: Restore the durable daily-advice archive independently of the 1-day cache
        if: steps.cache.outputs.plans_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cache.outputs.plans_name }}
          path: .cache/plans-restored
          github-token: ${{ github.token }}
          run-id: ${{ steps.cache.outputs.plans_run_id }}
      - name: Read the independent current-run official membership receipt
        if: needs.official-universe.outputs.receipt_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: huyan-current-official-universe
          path: .cache/universe
      - name: Collect or publish using actual Beijing time
        id: research
        env:
          RESEARCH_STAGE: ${{ steps.stage.outputs.stage }}
        run: >-
          python runner.py "$RESEARCH_STAGE"
          --engine-dir engine --state-dir .state
          --restore-cache .cache/restored --cache-output .cache/export
          --restore-plans .cache/plans-restored --plans-output .cache/plans-export
          --universe-dir .cache/universe
          --seed seed/research.json.gz --output-dir public
      - name: Commit changed public advice archive with optimistic concurrency protection
        if: steps.research.outputs.site_ready == 'true' && steps.stage.outputs.stage == 'publish'
        uses: actions/github-script@v7
        env:
          PLANS_BASE_SHA: ${{ steps.archives.outputs.plans_base_sha }}
        with:
          script: |
            const fs = require('node:fs'), crypto = require('node:crypto');
            const path = 'research/daily-plans.json', bytes = fs.readFileSync(path);
            const localSha = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
            const owner = context.repo.owner, repo = context.repo.repo, branch = context.payload.repository.default_branch;
            let remote = null;
            try { remote = (await github.rest.repos.getContent({owner,repo,path,ref:branch})).data; }
            catch (error) { if (error.status !== 404) throw error; }
            if (remote?.sha === localSha) { core.info('Public advice unchanged; no commit.'); return; }
            if ((remote?.sha || 'missing') !== process.env.PLANS_BASE_SHA) {
              throw new Error('Advice archive changed remotely. Refusing replacement; rerun with the latest checkout.');
            }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,
              message:'Update immutable public daily research archive', content:bytes.toString('base64'),
              ...(remote ? {sha:remote.sha} : {})});
      - name: Commit independent observation snapshots without rewriting published rankings
        if: steps.research.outputs.site_ready == 'true'
        uses: actions/github-script@v7
        env:
          WATCHLISTS_BASE_SHA: ${{ steps.archives.outputs.watchlists_base_sha }}
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const path='research/daily-watchlists.json',bytes=fs.readFileSync(path);
            const sha=crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.payload.repository.default_branch;
            let remote=null;
            try{remote=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;}
            catch(error){if(error.status!==404)throw error;}
            if(remote?.sha===sha){core.info('Observation snapshots unchanged; no commit.');return;}
            if((remote?.sha||'missing')!==process.env.WATCHLISTS_BASE_SHA)throw new Error('Observation archive changed remotely; refusing replacement.');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,
              message:'Persist independent observation snapshots with actual research times',content:bytes.toString('base64'),
              ...(remote?{sha:remote.sha}:{})});
      - name: Persist only sanitized public research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huyan-research-cache
          path: |
            .cache/export/research.sqlite3
            .cache/export/cache-meta.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1
          compression-level: 6
      - name: Back up the complete public daily-advice archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huyan-daily-plans
          path: .cache/plans-export/daily-plans.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
      - name: Package the static research site
        if: steps.research.outputs.site_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.research.outputs.site_ready == 'true' && vars.ENABLE_PAGES_DEPLOY != 'false'
    needs: research
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static research to Pages
        id: deployment
        uses: actions/deploy-pages@v4
  fundamentals:
    # Long financial refresh must not hold the shared queue ahead of 09:11/09:19
    # publication recovery. The last retry and closing updates continue the financial chain;
    # a manual fundamentals run executes that stage directly in research above.
    if: always() && needs.deploy.result == 'success' && needs.health.outputs.data_ready == 'true' && github.event_name == 'schedule' && (github.event.schedule == '19 1 * * 1-5' || github.event.schedule == '20 8 * * 1-5' || github.event.schedule == '10 9 * * 1-5')
    needs: [research, deploy, health]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    outputs:
      site_ready: ${{ steps.finance.outputs.site_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore this run's published research and immutable daily plan
        uses: actions/download-artifact@v4
        with:
          name: huyan-research-cache
          path: .cache/restored
      - name: Restore this run's complete daily-advice archive
        uses: actions/download-artifact@v4
        with:
          name: huyan-daily-plans
          path: .cache/plans-restored
      - name: Read the latest observation archive after the research stage commit
        id: financial-watchlists
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('node:fs');
            const path='research/daily-watchlists.json';
            const owner=context.repo.owner,repo=context.repo.repo,ref=context.payload.repository.default_branch;
            try {
              const current=(await github.rest.repos.getContent({owner,repo,path,ref})).data;
              if(current.type!=='file'||current.encoding!=='base64'||!current.sha)throw new Error('Invalid observation archive response');
              fs.mkdirSync('research',{recursive:true});
              fs.writeFileSync(path,Buffer.from(current.content.replace(/\s/g,''),'base64'));
              core.setOutput('base_sha',current.sha);
            } catch(error) {
              if(error.status!==404)throw error;
              fs.rmSync(path,{force:true});
              core.setOutput('base_sha','missing');
            }
      - name: Update long-term fundamentals without publishing a new daily plan
        id: finance
        run: >-
          python runner.py fundamentals
          --engine-dir engine --state-dir .state
          --restore-cache .cache/restored --cache-output .cache/financial-export
          --restore-plans .cache/plans-restored --plans-output .cache/financial-plans-export
          --seed seed/research.json.gz --output-dir public
      - name: Commit the financial stage's prepared observation archive safely
        if: steps.finance.outputs.site_ready == 'true'
        uses: actions/github-script@v7
        env:
          WATCHLISTS_BASE_SHA: ${{ steps.financial-watchlists.outputs.base_sha }}
        with:
          script: |
            const fs=require('node:fs'),crypto=require('node:crypto');
            const path='research/daily-watchlists.json',bytes=fs.readFileSync(path);
            const sha=crypto.createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
            const owner=context.repo.owner,repo=context.repo.repo,branch=context.payload.repository.default_branch;
            let remote=null;
            try{remote=(await github.rest.repos.getContent({owner,repo,path,ref:branch})).data;}
            catch(error){if(error.status!==404)throw error;}
            if(remote?.sha===sha){core.info('Financial observation archive unchanged.');return;}
            if((remote?.sha||'missing')!==process.env.WATCHLISTS_BASE_SHA)throw new Error('Financial observation archive changed remotely; refusing replacement.');
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,branch,
              message:'Persist prepared observation evidence after financial research',content:bytes.toString('base64'),
              ...(remote?{sha:remote.sha}:{})});
      - name: Persist updated public financial research
        if: always() && steps.finance.outputs.site_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: huyan-research-cache-financial
          path: |
            .cache/financial-export/research.sqlite3
            .cache/financial-export/cache-meta.json
          include-hidden-files: true
          retention-days: 1
          compression-level: 6
      - name: Preserve the complete public daily-advice archive after financial research
        if: always() && steps.finance.outputs.site_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: huyan-daily-plans-financial
          path: .cache/financial-plans-export/daily-plans.json
          include-hidden-files: true
          retention-days: 90
          compression-level: 6
      - name: Package the site with updated long-term research
        if: steps.finance.outputs.site_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-longterm
          path: public
  deploy-longterm:
    if: github.repository == 'Dopagip00/gup' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.fundamentals.outputs.site_ready == 'true' && vars.ENABLE_PAGES_DEPLOY != 'false'
    needs: fundamentals
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated long-term section
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-longterm
  cloud-status:
    # Surface actual failure in the run summary; the cloud monitor reads this
    # run's results. Failed refreshes leave the last successful Pages deployment.
    if: always()
    needs: [research, deploy, health, fundamentals, deploy-longterm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record actual cloud outcomes without claiming on-time publication
        uses: actions/github-script@v7
        env:
          RESEARCH_RESULT: ${{ needs.research.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          FUNDAMENTALS_RESULT: ${{ needs.fundamentals.result }}
          LONGTERM_RESULT: ${{ needs.deploy-longterm.result }}
          HEALTH_RESULT: ${{ needs.health.result }}
          RESEARCH_STAGE: ${{ needs.research.outputs.stage }}
        with:
          script: |
            const completedAt = new Date().toISOString();
            const results = [
              ['Research', process.env.RESEARCH_RESULT],
              ['Pages', process.env.DEPLOY_RESULT],
              ['Fundamentals', process.env.FUNDAMENTALS_RESULT],
              ['Long-term Pages', process.env.LONGTERM_RESULT],
              ['Public site verification', process.env.HEALTH_RESULT]
            ];
            await core.summary.addHeading('Actual cloud execution')
              .addRaw(`Event: ${context.eventName}; stage: ${process.env.RESEARCH_STAGE || 'unresolved'}; observed: ${completedAt}\n\n`)
              .addTable([['Job', 'Result'], ...results])
              .addLink('Open this run', `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`)
              .addRaw('\n\nGitHub schedules can queue or be delayed. Read the daily plan published_at and source timestamps; a successful job does not prove 09:00 publication.\n')
              .write();
            if (results.some(([, result]) => ['failure', 'cancelled'].includes(result))) {
              core.setFailed('A cloud stage failed or was cancelled. Review the job logs; the previous successful static site remains available.');
            }
  health:
    if: always() && needs.deploy.result == 'success'
    needs: [research, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      data_ready: ${{ steps.snapshot.outcome == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the public phone snapshot and completed-session freshness
        id: snapshot
        run: python cloud_health.py
      - name: Verify the independent daily observation ranking
        run: python watchlist_health.py
      - name: Diagnose formal morning qualification independently of observation availability
        if: github.event_name == 'schedule' && github.event.schedule == '19 1 * * 1-5'
        continue-on-error: true
        run: python cloud_health.py --require-morning
